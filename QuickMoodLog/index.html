<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Quick Mood Log</title>

    <p id="cheer-message" style="color: #e67e22; font-weight: bold; height: 1.5em;"></p>

    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px;}
        #log-list {list-style: none; padding: 0;}
        li { background: #f0f0f0; margin: 5px; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>今の気分は？</h1>
    <button onclick="addLog('😊 良い感じ', '#27ae60')">😊 良い感じ</button>
    <button onclick="addLog('😐 まあまあ', '#f39c12')">😐 まあまあ</button>
    <button onclick="addLog('😴 疲れ気味', '#2980b9')">😴 疲れ気味</button>
    
    <!-- 2026/01/13[火] 気分で絞り込み機能 -->
    <hr>
    <p>表示を絞り込む：
        <select id="filter-mood" onchange="filterLogs()">
            <option value="all">すべて表示</option>
            <option value="😊 良い感じ">😊 良い感じ</option>
            <option value="😐 まあまあ">😐 まあまあ</option>
            <option value="😴 疲れ気味">😴 疲れ気味</option>
        </select>
    </p>
    </hr>

    <p>現在の記録数： <span id="log-count">0</span>件</p>

    <hr>
    <button onclick="clearLogs()" style="background-color: #e74c3c; color: white">全ログ削除</button>
    </hr>

    <button onclick="addDateStamp()" style="background-color: #2c3e50; color: white;">今日の日付を挿入</button>

    <ul id="log-list">
        </ul>
    
    <script src="script.js"></script>
</body>
</html>
