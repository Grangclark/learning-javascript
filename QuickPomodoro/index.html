<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Quick Pomodoro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Quick Pomodoro</h1>
        <h2 id="mode-status">💻 集中タイム</h2>
        <div id="timer-display">25:00</div>

        <div class="controls">
            <button id="start-btn" onclick="startTimer()">Start</button>
            <button id="stop-btn" onclick="stopTimer()">Stop</button>
            <button id="reset-btn" onclick="resetTimer()">Reset</button>
        </div>

        <div id="stamps-container">
            <h3>今日の成果</h3>
                <span id="stamp-count">0</span>個
                <button id="clear-stamps-btn" onclick="clearStamps()">Clear</button>
        </div>
        <div id="stamps-list"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
