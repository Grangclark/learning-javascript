<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Mini Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Mini Expense Tracker</h1>

        <div id="input-section">
            <input type="date" id="expense-date">

            <input type="text" id="expense-name" placeholder="品目（例：ランチ）">
            <input type="number" id="expense-amount" placeholder="金額">

            <select id="expense-category">
                <option value="食費">食費</option>
                <option value="日用品">日用品</option>
                <option value="交際費">交際費</option>
                <option value="その他">その他</option>
            </select>
            <button onclick="addExpense()">追加</button>
        </div>

        <div id="total-section">
            <strong>総合計： </strong><span id="total-amount">0</span>円
            <button id="sort-btn" onclick="sortByAmount()">金額順に並べ替え</button>
            <button id="clear-btn" onclick="clearAll()">Clear All</button>
        </div>

        <div id="filter-section">
            <input type="month" id="filter-month" onchange="filterExpenses()">
            <button onclick="resetFilter()">全期間表示</button>
        </div>

        <div id="category-summary">
            <div>食費： <span id="cat-food">0</span>円</div>
            <div>日用品： <span id="cat-daily">0</span>円</div>
            <div>交際費： <span id="cat-social">0</span>円</div>
            <div>その他： <span id="cat-other">0</span>円</div>
        </div>

        <div style="max-width: 300px; margin: 20px auto;">
            <canvas id="expense-chart"></canvas>
        </div>

        <ul id="expense-list">
            </ul>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
