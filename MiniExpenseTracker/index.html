<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Mini Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Mini Expense Tracker</h1>

        <div id="input-section">
            <input type="date" id="expense-date">

            <input type="text" id="expense-name" placeholder="品目（例：ランチ）">
            <input type="number" id="expense-amount" placeholder="金額">

            <select id="expense-category">
                <option value="食費">食費</option>
                <option value="日用品">日用品</option>
                <option value="交際費">交際費</option>
                <option value="その他">その他</option>
            </select>
            <button onclick="addExpense()">追加</button>
        </div>

        <div id="category-manager" style="margin-bottom: 20px;">
            <input type="text" id="new-category-name" placeholder="新しいカテゴリ名（例：趣味）">
            <button onclick="addCategory()">カテゴリ追加</button>
        </div>

        <div id="total-section">
            <strong>総合計： </strong><span id="total-amount">0</span>円
            <button id="sort-btn" onclick="sortByAmount()">金額順に並べ替え</button>
            <button id="clear-btn" onclick="clearAll()">Clear All</button>
        </div>

        <div id="filter-section">
            <input type="month" id="filter-month" onchange="filterExpenses()">
            <button onclick="resetFilter()">全期間表示</button>
            <button onclick="exportToCSV()" style="background-color: #2ecc71; color: white;">CSVで保存</button>
        </div>

        <div id="budget-section" style="margin-bottom: 20px;">
            <label>今月の予算: </label>
            <input type="number" id="monthly-budget" placeholder="例: 50,000" onchange="saveBudget()">
            <span>円</span>

            <div style="width: 100%; background: #eee; height: 20px; border-radius: 10px; margin-top: 10px; overflow: hidden;">
                <div id="budget-bar" style="width: 0%; height: 100%; background: #4caf50; transition: 0.3s;"></div>
            </div>
            <p id="budget-status" style="font-size: 0.9em; margin-top: 5px;"></p>
        </div>

        <div id="category-summary" style="padding: 10px; background: #f9f9f9; margin-bottom: 10px;">
            </div>

        <div style="max-width: 300px; margin: 20px auto;">
            <canvas id="expense-chart"></canvas>
        </div>

        <ul id="expense-list">
            </ul>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
