<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Mini Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Mini Expense Tracker</h1>

        <div class="input-section">
            <input type="text" id="item-name" placeholder="何に使った？（例：ランチ）">
            <input type="number" id="item-amount" placeholder="金額">
            <button id="add-btn" onclick="addExpense()">追加</button>
        </div>

        <div class="total-section">
            <strong>合計支出： </strong>
            <span id="total-amount">0</span>円
            <button id="clear-btn" onclick="clearAll()">Clear All</button>
        </div>

        <ul id="expense-list">
            </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
