<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>5ch.io Viewer</title>
    <style>
        body { width: 300px; font-family: sans-serif; font-size: 14px; }
        ul { padding-left: 20px; }
        #back-btn { margin-bottom: 10px; padding: 5px 10px; cursor: pointer; }
        #history-section { background: #f0f0f0; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        #history-list { margin: 0; padding-left: 20px; }
        
        /* ★検索窓をちょっとだけ見やすくするデザイン */
        #search-container { margin-bottom: 10px; }
        #search-input { width: 93%; padding: 5px; font-size: 14px; }
    </style>
</head>
<body>
    <h3>5ch.io 板一覧</h3>
    
    <div id="history-section" style="display: none;">
        <strong>最近見たスレッド</strong>
        <ul id="history-list"></ul>
    </div>

    <button id="back-btn" style="display: none;">← 板一覧に戻る</button>

    <div id="search-container" style="display: none;">
        <input type="text" id="search-input" placeholder="スレッド名で絞り込み...">
    </div>

    <ul id="bbs-list">読み込み中...</ul>

    <script src="script.js"></script>
</body>
</html>
