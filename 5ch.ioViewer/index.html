<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>5ch.io Viewer</title>
    <style>
        body { width: 300px; font-family: sans-serif; font-size: 14px; }
        ul { padding-left: 20px; }
        #back-btn { margin-bottom: 10px; padding: 5px 10px; cursor: pointer; }
        
        /* 特設エリアデザイン */
        #fav-boards-section { background: #fff9e6; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ffe0b2; }
        #fav-boards-list { margin: 0; padding-left: 20px; }
        #fav-threads-section { background: #e0f2f1; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #b2dfdb; }
        #fav-threads-list { margin: 0; padding-left: 20px; }
        #history-section { background: #f0f0f0; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #e0e0e0; }
        #history-list { margin: 0; padding-left: 20px; }

        /* 検索とソートのデザイン */
        #board-search-container { margin-bottom: 10px; }
        /* ★【今日の一撃】横幅を 93% から 100% にして、box-sizing を指定することで、枠線がはみ出さないように綺麗にフィットさせます */
        #board-search-input { width: 100%; padding: 5px; font-size: 14px; background-color: #f9f9f9; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }

        #search-container { margin-bottom: 5px; }
        /* ★【今日の一撃】スレッド検索窓も同様に綺麗にフィットさせます */
        #search-input { width: 100%; padding: 5px; font-size: 14px; box-sizing: border-box; }
        
        #sort-container { margin-bottom: 10px; display: flex; gap: 5px; }
        .sort-btn { flex: 1; padding: 4px; font-size: 12px; cursor: pointer; }

        .list-item-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .fav-btn { cursor: pointer; font-size: 16px; color: #ffa000; user-select: none; padding-left: 5px; }
    </style>
</head>
<body>
    <h3>5ch.io 板一覧</h3>
    
    <div id="fav-boards-section" style="display: none;">
        <strong>★ お気に入り板</strong>
        <ul id="fav-boards-list"></ul>
    </div>
    <div id="fav-threads-section" style="display: none;">
        <strong>★ お気に入りスレッド</strong>
        <ul id="fav-threads-list"></ul>
    </div>
    <div id="history-section" style="display: none;">
        <strong>最近見たスレッド</strong>
        <ul id="history-list"></ul>
    </div>

    <button id="back-btn" style="display: none;">← 板一覧に戻る</button>

    <div id="board-search-container">
        <input type="search" id="board-search-input" placeholder="板名で絞り込み（例: ゲーム）...">
    </div>

    <div id="search-container" style="display: none;">
        <input type="search" id="search-input" placeholder="スレッド名で絞り込み...">
    </div>

    <div id="sort-container" style="display: none;">
        <button id="sort-default-btn" class="sort-btn" disabled>標準順</button>
        <button id="sort-momentum-btn" class="sort-btn">勢い順 🔥</button>
    </div>

    <ul id="bbs-list">読み込み中...</ul>

    <script src="script.js"></script>
</body>
</html>
